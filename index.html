<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>트레이닝 로그</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동로그">
<meta name="theme-color" content="#141619">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141619; --card:#1E2126; --card2:#262A31;
  --ink:#F2F0EA; --sub:#8A8F98; --line:#31363E;
  --push:#D64545; --pull:#3D7BD9; --legs:#35A56B; --gold:#E8B54A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;padding-bottom:110px}
button,input,textarea{font-family:inherit}

header{padding:20px 18px 4px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;font-weight:900;letter-spacing:-.5px}
.hd-right{display:flex;align-items:center;gap:8px}
.hd-date{font-size:13px;color:var(--sub)}
.ver{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-family:'Archivo',sans-serif}
.rf-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:15px;line-height:1}

.view-sw{display:flex;margin:12px 18px 0;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--line)}
.view-sw button{flex:1;padding:9px 0;border:0;background:transparent;color:var(--sub);font-weight:700;font-size:14px;border-radius:9px}
.view-sw button.on{background:var(--card2);color:var(--ink)}

.tabs{display:flex;gap:8px;padding:16px 18px 4px}
.tab{flex:1;padding:13px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center;color:var(--sub);font-weight:800;font-size:14.5px}
.tab.on{color:#fff;border-color:transparent}
.tab.on.t-push{background:var(--push)}
.tab.on.t-pull{background:var(--pull)}
.tab.on.t-legs{background:var(--legs)}

.note-row{display:flex;align-items:flex-start;gap:10px;margin:10px 18px 0}
.day-note{flex:1;font-size:12.5px;color:var(--sub);line-height:1.55}
.edit-btn{border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap}
.edit-btn.on{color:var(--gold);border-color:var(--gold)}
.legend{margin:8px 18px 0;font-size:11.5px;color:var(--sub)}
.legend b{color:var(--gold);font-weight:700}

.list{padding:12px 14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;margin-bottom:12px}
.ex-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-size:15.5px;font-weight:700;line-height:1.3}
.ex-name .star{color:var(--gold);margin-right:3px}
.ex-scheme{font-size:12px;color:var(--sub);white-space:nowrap;padding-top:2px}
.ex-goal{font-size:12px;color:var(--sub);margin-top:6px}
.ex-goal b{color:var(--ink);font-weight:700}
.ex-tip{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5;border-left:2px solid var(--line);padding-left:8px}
.ex-body{display:flex;align-items:flex-start;gap:10px;margin-top:14px;flex-wrap:wrap}
.act-col{display:flex;flex-direction:column;gap:6px}
.rec-btn{border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:12px;font-weight:700;padding:9px 12px;border-radius:10px;white-space:nowrap}
.cfg-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cfg-row input{width:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;font-weight:800;text-align:center;padding:8px 4px;outline:0;font-family:'Archivo',sans-serif}
.cfg-row button{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;font-weight:700;padding:9px 10px;border-radius:9px}
.sug-btn{border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap}
.sug-box{margin:10px 18px 0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;line-height:1.6}
.sug-box b{color:var(--gold)}
.sug-acts{display:flex;gap:8px;margin-top:8px}
.sug-acts button{border:0;font-weight:800;font-size:12px;padding:8px 14px;border-radius:8px}
.sug-add{background:var(--gold);color:#141619}
.sug-next{background:var(--card);color:var(--sub);border:1px solid var(--line)!important}
.unit-tag{font-size:11px;color:var(--sub);text-align:center;font-weight:700}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.sw{width:46px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;font-weight:800;text-align:center;padding:5px 2px;outline:0;font-family:'Archivo',sans-serif}
.plate{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--line);background:var(--card2);color:var(--sub);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;transition:transform .08s}
.plate:active{transform:scale(.9)}
.plate.done{color:#fff;border-color:transparent;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
.d-push .plate.done{background:var(--push)}
.d-pull .plate.done{background:var(--pull)}
.d-legs .plate.done{background:var(--legs)}
.plate.fail{background:var(--gold)!important;color:#141619;border-color:transparent;box-shadow:none}

.rec-box{margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.55;display:flex;align-items:center;gap:10px}
.rec-box .msg{flex:1}
.rec-box .msg b{color:var(--gold)}
.rec-box button{border:0;background:var(--gold);color:#141619;font-weight:800;font-size:12px;padding:8px 14px;border-radius:8px;white-space:nowrap}

/* edit mode */
.ef{display:flex;flex-direction:column;gap:8px}
.ef label{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:-4px}
.ef input,.ef textarea{background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:14px;padding:9px 10px;outline:0;width:100%}
.ef textarea{resize:none;line-height:1.5}
.ef-row{display:flex;gap:8px}
.ef-row>div{flex:1}
.name-wrap{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:20;max-height:230px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sug div{padding:11px 12px;font-size:14px;border-bottom:1px solid var(--line)}
.sug div:last-child{border-bottom:0}
.sug .cat{color:var(--sub);font-size:11px;margin-left:6px}
.sug .custom-mark{color:var(--gold);font-size:11px;margin-left:6px}
.del-btn{border:0;background:rgba(214,69,69,.14);color:var(--push);font-weight:700;font-size:13px;padding:10px 0;border-radius:10px;margin-top:4px;width:100%}
.add-btn{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--sub);font-weight:700;font-size:14px;padding:15px 0;border-radius:16px;margin-bottom:12px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;align-items:center;z-index:5}
.bar .cnt{font-size:13px;color:var(--sub);min-width:74px}
.bar .cnt b{color:var(--ink);font-size:16px;font-family:'Archivo',sans-serif}
.done-btn{flex:1;padding:15px 0;border:0;border-radius:14px;font-size:15.5px;font-weight:800;color:#fff}
.d-push .done-btn{background:var(--push)}
.d-pull .done-btn{background:var(--pull)}
.d-legs .done-btn{background:var(--legs)}
.done-btn.checked{background:var(--card2)!important;color:var(--gold)}

/* rest timer */
.timer{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:10px 14px 10px 20px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.25s;z-index:6;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.timer.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.timer .t-label{font-size:11px;color:var(--sub);font-weight:700}
.timer .t-time{font-size:24px;font-weight:800;font-family:'Archivo',sans-serif;min-width:74px;text-align:center}
.timer.flash .t-time{color:var(--gold)}
.timer button{border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;font-weight:700;padding:8px 12px;border-radius:99px}

/* history */
.hist{padding:14px 18px}
.h-sum{display:flex;gap:10px;margin-bottom:14px}
.h-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.h-box .v{font-size:24px;font-weight:800;font-family:'Archivo',sans-serif}
.h-box .k{font-size:11.5px;color:var(--sub);margin-top:2px}
.h-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.h-tag{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;text-align:center;line-height:1.2}
.h-tag.push{background:var(--push)}.h-tag.pull{background:var(--pull)}.h-tag.legs{background:var(--legs)}
.h-info{flex:1}
.h-date{font-size:14px;font-weight:700}
.h-meta{font-size:12px;color:var(--sub);margin-top:2px}
.h-badge{font-size:11.5px;font-weight:700;color:var(--gold)}
.empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px;line-height:1.6}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%) translateY(8px);background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:7}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 칼로리 칩 */
.kcal{font-size:12px;color:var(--sub);font-weight:700}
.kcal b{color:var(--gold);font-family:'Archivo',sans-serif;font-size:15px}

/* 프로필 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none}
.modal-bg.show{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,340px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;z-index:11;display:none}
.modal.show{display:block}
.modal h2{font-size:16px;font-weight:800;margin-bottom:4px}
.modal .m-sub{font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:14px}
.m-row{display:flex;gap:8px;margin-bottom:10px}
.m-row>div{flex:1}
.modal label{font-size:11px;color:var(--sub);font-weight:700;display:block;margin-bottom:4px}
.modal input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:15px;padding:10px;outline:0}
.sex-sw{display:flex;gap:6px}
.sex-sw button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-weight:700;border-radius:9px;font-size:14px}
.sex-sw button.on{background:var(--gold);color:#141619;border-color:transparent}
.m-save{width:100%;padding:13px 0;border:0;border-radius:11px;background:var(--gold);color:#141619;font-weight:800;font-size:15px;margin-top:6px}
.m-note{font-size:10.5px;color:var(--sub);line-height:1.5;margin-top:10px}

/* 주간 리포트 */
.wk-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-size:12.5px;line-height:1.7;color:var(--sub)}
.wk-card h3{font-size:13px;color:var(--ink);font-weight:800;margin-bottom:4px}
.wk-card b{color:var(--gold)}
.up{color:#35A56B!important}.dn{color:#D64545!important}

/* 그래프 카드 */
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.chart-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chart-hd select{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;font-weight:700;padding:7px 8px;outline:0;max-width:55%}
.big3{font-size:11.5px;color:var(--sub);font-weight:700;text-align:right}
.big3 b{color:var(--gold);font-family:'Archivo',sans-serif;font-size:15px}
#chartBox svg{width:100%;height:150px;display:block}
.chart-empty{color:var(--sub);font-size:12.5px;text-align:center;padding:24px 0}

/* 백업 */
.bk-row{display:flex;gap:8px;margin-top:4px}
.bk-row button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);font-weight:700;font-size:13px;padding:12px 0;border-radius:11px}
.bk-ta{width:100%;height:120px;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:11px;padding:8px;outline:0;resize:none;font-family:monospace}

/* 업데이트 배너 */
.upd-banner{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--gold);color:#141619;font-size:13px;font-weight:800;padding:12px 16px;display:none;align-items:center;justify-content:center;gap:12px}
.upd-banner.show{display:flex}
.upd-banner button{border:0;background:#141619;color:var(--gold);font-weight:800;font-size:12px;padding:7px 14px;border-radius:99px}

/* 마지막 운동 안내 */
.last-line{margin:8px 18px 0;font-size:12px;color:var(--sub)}
.last-line b{color:var(--ink)}

/* 편집 순서 이동 */
.ef-move{display:flex;gap:6px;justify-content:flex-end;margin-bottom:-4px}
.ef-move button{border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:13px;font-weight:800;width:34px;height:30px;border-radius:8px}
</style>
</head>
<body class="d-push">

<div class="upd-banner" id="updBanner"><span id="updMsg">새 버전이 있어요</span><button id="updGo">업데이트</button></div>

<header>
  <h1>트레이닝 로그</h1>
  <div class="hd-right">
    <span class="ver" id="verTag"></span>
    <span class="hd-date" id="hdDate"></span>
    <button class="rf-btn" id="profBtn" title="내 정보">👤</button>
    <button class="rf-btn" id="refreshBtn" title="새 버전 확인">⟳</button>
  </div>
</header>

<div class="view-sw">
  <button id="vToday" class="on">오늘 운동</button>
  <button id="vHist">기록 보기</button>
</div>
<div class="last-line" id="lastLine"></div>

<div id="todayView">
  <div class="tabs" id="tabs"></div>
  <div class="note-row">
    <div class="day-note" id="dayNote"></div>
    <button class="sug-btn" id="sugBtn">💡 추천</button>
    <button class="edit-btn" id="editBtn">✎ 편집</button>
  </div>
  <div id="sugSlot"></div>
  <div class="legend">세트 버튼: 한 번 탭 = 완료 · 두 번 탭 = <b>실패지점 ⚡</b> · 세 번 탭 = 해제</div>
  <div class="list" id="exList"></div>
</div>

<div id="histView" class="hidden">
  <div class="hist">
    <div class="wk-card" id="wkCard"></div>
    <div class="h-sum">
      <div class="h-box"><div class="v" id="sTotal">0</div><div class="k">총 출석</div></div>
      <div class="h-box"><div class="v" id="sMonth">0</div><div class="k">이번 달</div></div>
      <div class="h-box"><div class="v" id="sWeek">0</div><div class="k">이번 주</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-hd">
        <select id="chartSel"></select>
        <div class="big3" id="big3"></div>
      </div>
      <div id="chartBox"></div>
    </div>
    <div id="histList"></div>
    <div class="bk-row">
      <button id="bkExport">📤 기록 백업</button>
      <button id="bkImport">📥 복원</button>
    </div>
  </div>
</div>

<div class="bar" id="bar">
  <div class="cnt"><b id="cntDone">0</b><span id="cntTotal">/0 세트</span><div class="kcal" id="kcalChip">🔥 <b>--</b> kcal</div></div>
  <button class="done-btn" id="doneBtn">오늘 출석 체크 ✓</button>
</div>

<div class="modal-bg" id="modalBg"></div>
<div class="modal" id="profModal">
  <h2>내 정보</h2>
  <div class="m-sub">운동 소모 칼로리 계산에 사용돼요. 이 정보는 내 폰에만 저장됩니다.</div>
  <div class="m-row">
    <div><label>키 (cm)</label><input type="number" inputmode="decimal" id="pHeight" placeholder="175"></div>
    <div><label>몸무게 (kg)</label><input type="number" inputmode="decimal" id="pWeight" placeholder="70"></div>
  </div>
  <div class="m-row">
    <div><label>나이</label><input type="number" inputmode="numeric" id="pAge" placeholder="30"></div>
    <div><label>성별</label>
      <div class="sex-sw">
        <button id="pMale">남</button><button id="pFemale">여</button>
      </div>
    </div>
  </div>
  <button class="m-save" id="pSave">저장</button>
  <div class="m-note">계산식: 웨이트 트레이닝 MET × 개인 기초대사량 기반 보정 × 운동 시간(완료 세트당 약 2.5분). 실측이 아닌 추정치입니다.</div>
</div>

<div class="timer" id="timer">
  <div>
    <div class="t-label">휴식</div>
    <div class="t-time" id="tTime">1:00</div>
  </div>
  <button id="tPlus">+30초</button>
  <button id="tSkip">건너뛰기</button>
</div>

<div class="modal" id="bkModal">
  <h2 id="bkTitle">기록 백업</h2>
  <div class="m-sub" id="bkSub"></div>
  <textarea class="bk-ta" id="bkTa"></textarea>
  <button class="m-save" id="bkAction">복사하기</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 운동 라이브러리 ============ */
const EXLIB = [
  // 가슴
  ['바벨 벤치 프레스','가슴'],['인클라인 벤치 프레스','가슴'],['디클라인 벤치 프레스','가슴'],
  ['덤벨 벤치 프레스','가슴'],['인클라인 덤벨 프레스','가슴'],['디클라인 덤벨 프레스','가슴'],
  ['덤벨 플라이','가슴'],['인클라인 덤벨 플라이','가슴'],['케이블 크로스오버','가슴'],
  ['로우 케이블 크로스오버','가슴'],['펙덱 플라이','가슴'],['체스트 프레스 머신','가슴'],

const $ = id => document.getElementById(id);
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const cleanName = n => String(n||'').replace(/^★/,'').trim();

// 바벨 운동 판별 (원판 2.5/5/10/20 + 빈 봉 20kg 제약 적용 대상)
const BARBELL_EX = new Set(['컨벤셔널 데드리프트','루마니안 데드리프트','스모 데드리프트','펜들레이 로우','프론트 스쿼트','밀리터리 프레스','클로즈그립 벤치 프레스','인클라인 벤치 프레스','디클라인 벤치 프레스','티바 로우']);
const isBarbell = (name,u) => (u||'kg')==='kg' && (name.includes('바벨')||BARBELL_EX.has(name));
// 봉 20kg + 한쪽 원판(2.5 최소) 페어 → 5kg 단위, 최소 20kg
const barbellRound = v => Math.max(20, 20 + Math.round((v-20)/5)*5);
// 한쪽에 꽂을 원판 조합 (큰 것부터)
function plateBreak(total){
  let per=(total-20)/2;
  if(per<0) return null;
  if(per===0) return '빈 봉';
  const out=[];
  for(const p of [20,10,5,2.5]){
    const c=Math.floor(per/p+1e-9);
    if(c>0){ out.push(c>1?`${p}×${c}`:`${p}`); per=+(per-p*c).toFixed(2); }
  }
  return per>0?null:'한쪽 '+out.join(' + ');
}
// 서포트 머신(보조) 운동 — 무게가 낮을수록 어려움
const ASSIST_EX = new Set(['딥스','풀업','친업']);
const isAssist = u => u==='보조kg';

let plan, curPart='push', session=null, index=[], exlog={}, editMode=false, saveTimer=null;

/* ---- storage ---- */
function sGet(k){ try{ const r=localStorage.getItem('wlog:'+k); return r?JSON.parse(r):null; }catch(e){ return null; } }
function sSet(k,v){ try{ localStorage.setItem('wlog:'+k, JSON.stringify(v)); }catch(e){ console.error(e); } }

/* ---- session ---- */
function defaultSession(part){
  return { part, sets: plan[part].ex.map(e=>Array(e.s).fill(0)), weights: plan[part].ex.map(e=>Array(e.s).fill(e.w)), done:false };
}
// 구버전 데이터 마이그레이션: boolean 세트 → 0/1/2, 단일 중량 → 세트별 배열
function syncSession(){
  const exs=plan[curPart].ex;
  while(session.sets.length<exs.length){ session.sets.push([]); session.weights.push([]); }
  session.sets.length=exs.length; session.weights.length=exs.length;
  exs.forEach((e,i)=>{
    if(!Array.isArray(session.sets[i])) session.sets[i]=[];
    session.sets[i]=session.sets[i].map(v=>v===true?1:(v===false?0:(v||0)));
    while(session.sets[i].length<e.s) session.sets[i].push(0);
    session.sets[i].length=e.s;
    // 중량: 숫자(구버전) → 배열
    if(typeof session.weights[i]==='number'||session.weights[i]==null){
      const v=(typeof session.weights[i]==='number')?session.weights[i]:e.w;
      session.weights[i]=Array(e.s).fill(v);
    }
    if(!Array.isArray(session.weights[i])) session.weights[i]=Array(e.s).fill(e.w);
    const lastW=session.weights[i].length?session.weights[i][session.weights[i].length-1]:e.w;
    while(session.weights[i].length<e.s) session.weights[i].push(lastW);
    session.weights[i].length=e.s;
  });
}

/* ---- render: main ---- */
function renderTabs(){
  $('tabs').innerHTML = Object.keys(plan).map(k=>
    `<div class="tab t-${k} ${k===curPart?'on':''}" data-p="${k}">${plan[k].label}</div>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchPart(t.dataset.p));
  $('dayNote').textContent = plan[curPart].note;
  document.body.className = 'd-'+curPart;
}

function plateClass(v){ return v===1?'done':(v===2?'done fail':''); }
function plateLabel(v,j){ return v===2?'⚡':(j+1); }

function renderExercises(){
  syncSession();
  if(editMode){ renderEdit(); return; }
  $('exList').innerHTML = plan[curPart].ex.map((e,i)=>{
    const star = e.n.startsWith('★');
    const name = cleanName(e.n);
    const plates = session.sets[i].map((v,j)=>
      `<div class="set-col">
        <button class="plate ${plateClass(v)}" data-e="${i}" data-s="${j}">${plateLabel(v,j)}</button>
        <input class="sw" type="number" inputmode="decimal" step="0.5" value="${session.weights[i][j]}" data-we="${i}" data-ws="${j}">
      </div>`).join('');
    return `<div class="ex">
      <div class="ex-hd">
        <div class="ex-name">${star?'<span class="star">★</span>':''}${esc(name)}</div>
        <div class="ex-scheme">${esc(e.r)} × ${e.s}세트</div>
      </div>
      ${e.goal!==''&&e.goal!=null?`<div class="ex-goal">목표: <b>${esc(e.goal)}${esc(e.u||'kg')}</b></div>`:''}
      ${e.tip?`<div class="ex-tip">${esc(e.tip)}</div>`:''}
      <div class="ex-body">
        <div class="act-col">
          <button class="rec-btn" data-rec="${i}">📊 추천</button>
          <button class="rec-btn" data-cfg="${i}">⚙ 구성</button>
          <div class="unit-tag">${esc(e.u||'kg')}</div>
        </div>
        <div class="sets">${plates}</div>
      </div>
      <div class="rec-slot" id="recSlot${i}"></div>
    </div>`;
  }).join('');

  document.querySelectorAll('.plate').forEach(b=>b.onclick=()=>{
    const e=+b.dataset.e, s=+b.dataset.s;
    const cur=session.sets[e][s];
    const next=(cur+1)%3; // 0→1(완료)→2(실패)→0
    session.sets[e][s]=next;
    if(next>0){ if(!session.t0) session.t0=Date.now(); session.t1=Date.now(); }
    b.className='plate '+plateClass(next);
    b.textContent=plateLabel(next,s);
    if(next===1) startTimer(plan[curPart].ex[e].rest||60);
    updateCount(); queueSave();
  });
  document.querySelectorAll('.sw').forEach(inp=>inp.onchange=()=>{
    const e=+inp.dataset.we, s=+inp.dataset.ws;
    const v=parseFloat(inp.value)||0;
    session.weights[e][s]=v;
    // 1세트 값을 바꾸면 아직 시작 안 한(미완료) 뒷세트에 자동 반영
    if(s===0){
      for(let j=1;j<session.weights[e].length;j++){
        if(session.sets[e][j]===0){
          session.weights[e][j]=v;
          const el=document.querySelector(`.sw[data-we="${e}"][data-ws="${j}"]`);
          if(el) el.value=v;
        }
      }
    }
    queueSave();
  });
  document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>showRec(+b.dataset.rec));
  document.querySelectorAll('[data-cfg]').forEach(b=>b.onclick=()=>showCfg(+b.dataset.cfg));
  document.querySelectorAll('.ex-name').forEach((el,i)=>el.onclick=()=>showExHist(i));
  updateCount(); renderDoneBtn();
}

/* ---- 운동 이름 탭 → 지난 기록 상세 ---- */
function showExHist(i){
  const slot=$('recSlot'+i);
  if(slot.innerHTML){ slot.innerHTML=''; return; }
  const e=plan[curPart].ex[i];
  const name=cleanName(e.n);
  const logs=(exlog[name]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  if(!logs.length){
    slot.innerHTML=`<div class="rec-box"><div class="msg">아직 저장된 기록이 없어요. 오늘 세트를 체크하면 기록이 쌓입니다.</div></div>`;
    return;
  }
  const rows=logs.map(l=>{
    const cells=l.sets.map((s,j)=>{
      const w=(l.ws&&l.ws[j]!=null)?l.ws[j]:l.w;
      return s===2?`<b style="color:var(--gold)">${w}⚡</b>`:(s===1?`${w}`:`<span style="opacity:.4">${w}·미수행</span>`);
    }).join(' / ');
    return `<div style="margin-top:6px"><b style="color:var(--ink)">${l.date}</b> · ${cells} ${e.u||'kg'}</div>`;
  }).join('');
  slot.innerHTML=`<div class="rec-box"><div class="msg"><b>${esc(name)}</b> 최근 기록${rows}</div></div>`;
}

/* ---- 세트 구성 자동 계산 (램프업/동일/백오프) ---- */
function roundStep(v, top, opt){
  if(opt&&opt.barbell) return barbellRound(v);
  if(opt&&opt.assist) return Math.max(0, Math.round(v/5)*5);
  const step = top>=40?2.5:(top>=10?1:0.5);
  return Math.max(0, Math.round(v/step)*step);
}
function showCfg(i){
  const slot=$('recSlot'+i);
  if(slot.innerHTML){ slot.innerHTML=''; return; }
  const e=plan[curPart].ex[i];
  const u=e.u||'kg';
  const assist=isAssist(u);
  const barbell=isBarbell(cleanName(e.n),u);
  const arr=session.weights[i];
  const curTop=(assist? Math.min(...arr) : Math.max(...arr,0))||e.w||0;
  slot.innerHTML=`<div class="rec-box"><div class="msg" style="width:100%">
    <div style="margin-bottom:8px">${assist?'탑세트(가장 어려운 세트)의 <b>최소 보조</b> 무게를 넣으세요. 보조가 낮을수록 어려워요.':'오늘의 탑세트(최대) 중량을 넣고 방식을 고르세요.'}</div>
    <div class="cfg-row">
      <input type="number" inputmode="decimal" step="0.5" id="cfgTop${i}" value="${isFinite(curTop)?curTop:0}">
      <span style="font-size:11px;color:var(--sub)">${esc(u)}</span>
      <button data-mode="ramp">📈 램프업</button>
      <button data-mode="same">＝ 동일</button>
      <button data-mode="back">📉 백오프</button>
    </div>
    ${barbell?`<div id="cfgPlate${i}" style="margin-top:8px;font-size:11.5px;color:var(--sub)"></div>`:''}
  </div></div>`;
  const inp=$('cfgTop'+i);
  if(barbell){
    const showPlate=()=>{
      const v=barbellRound(parseFloat(inp.value)||20);
      $('cfgPlate'+i).innerHTML=`원판 기준 <b style="color:var(--ink)">${v}kg</b> → ${plateBreak(v)||'조합 불가'} <span style="opacity:.7">(원판 2.5/5/10/20 · 봉 20kg)</span>`;
    };
    inp.oninput=showPlate; showPlate();
  }
  slot.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{
    let top=parseFloat(inp.value)||0;
    if(!top&&!assist){ toast('탑세트 중량을 입력해 주세요'); return; }
    const opt={barbell,assist};
    if(barbell) top=barbellRound(top);
    if(assist) top=Math.max(0,Math.round(top/5)*5);
    const n=arr.length;
    let ws;
    if(btn.dataset.mode==='same'){
      ws=Array(n).fill(top);
    }else if(btn.dataset.mode==='ramp'){
      if(assist){
        // 보조: 처음엔 보조 많이(쉽게) → 탑세트에서 최소 보조
        ws=Array.from({length:n},(_,j)=> top + 5*(n-1-j));
      }else{
        ws=Array.from({length:n},(_,j)=> n===1?top : roundStep(top*(0.7+0.3*j/(n-1)), top, opt));
        ws[n-1]=top;
      }
    }else{
      if(assist){
        // 보조 백오프: 탑 유지하다 막세트만 보조 +5 (실패 방지)
        ws=Array(n).fill(top);
        if(n>=2) ws[n-1]=top+5;
      }else{
        ws=Array(n).fill(top);
        if(n>=2) ws[n-1]=roundStep(top*0.9, top, opt);
      }
    }
    session.weights[i]=ws;
    queueSave(); slot.innerHTML='';
    renderExercises();
    toast(btn.dataset.mode==='ramp'?'램프업 구성 적용 📈':btn.dataset.mode==='back'?'백오프 구성 적용 📉':'전 세트 동일 적용');
  });
}

/* ---- 중량/횟수 추천 ---- */
function showRec(i){
  const slot=$('recSlot'+i);
  if(slot.innerHTML){ slot.innerHTML=''; return; } // 토글
  const e=plan[curPart].ex[i];
  const name=cleanName(e.n);
  const logs=(exlog[name]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))
    .filter(l=>l.date!==todayStr() && l.sets.some(s=>s>0));
  if(!logs.length){
    slot.innerHTML=`<div class="rec-box"><div class="msg">아직 이 운동의 지난 기록이 없어요. 오늘 수행하면 다음부터 추천해 드립니다.</div></div>`;
    return;
  }
  const u=e.u||'kg';
  const name2=cleanName(e.n);
  const assist=isAssist(u);
  const barbell=isBarbell(name2,u);
  const last=logs[0];
  const total=last.sets.length;
  const doneCnt=last.sets.filter(s=>s>0).length;
  const failIdx=last.sets.findIndex(s=>s===2);
  // 탑세트: 일반 운동은 최고 중량, 보조 운동은 최소 보조(가장 어려운 세트)
  const w=last.w||0;
  const inc = barbell?5:(assist?5:(w>=40?2.5:(w>=10?1:0.5)));
  const fit = v => barbell?barbellRound(v):Math.max(0,v);
  const isClean = l => !l.sets.includes(2) && l.sets.every(s=>s>0);
  let streak=0;
  for(const l of logs){
    if(l.w===w && isClean(l)) streak++;
    else break;
  }
  let recW=w, msg='';
  // 디로드 감지: 4회 이상 기록 + 최근 3회 중 실패 2회 이상 + 중량 정체
  const recentFails = logs.slice(0,3).filter(l=>l.sets.includes(2)).length;
  const stagnant = logs.length>=4 && (assist? logs[0].w>=logs[3].w : logs[0].w<=logs[3].w);
  if(!assist && recentFails>=2 && stagnant){
    recW=fit(w*0.85);
    msg=`최근 3회 중 ${recentFails}회 실패 + 중량 정체 → <b>디로드 주간 추천</b>. 이번 주는 <b>${recW}${u}</b>(약 85%)로 가볍게 회복하고, 다음 주에 <b>${w}${u}</b>로 복귀하면 정체가 뚫리는 경우가 많아요.`;
  }else if(failIdx>=0 && failIdx<total-1){
    recW = assist? w+inc : fit(w-inc);
    msg = assist
      ? `지난 기록(${last.date}) ${failIdx+1}세트에서 조기 실패 → 보조를 <b>${recW}${u}</b>로 올려(난이도 다운) 볼륨을 다지는 걸 추천.`
      : `지난 기록(${last.date}) ${failIdx+1}세트에서 조기 실패 → 탑세트 <b>${recW}${u}</b>로 낮춰 자세와 볼륨을 다지는 걸 추천.`;
  }else if(failIdx===total-1){
    recW=w;
    msg=`지난 기록(${last.date}) 마지막 세트에서 실패 → <b>${w}${u} 유지</b> 추천. 무실패 3회를 만들면 다음 단계로 갑니다.`;
  }else if(doneCnt<total){
    recW=w;
    msg=`지난 기록(${last.date}) ${doneCnt}/${total} 세트 수행 → <b>${w}${u} 유지</b>하고 전 세트 완수부터.`;
  }else if(streak>=3){
    recW = assist? Math.max(w-inc,0) : fit(w+inc);
    msg = assist
      ? `보조 <b>${w}${u}</b>에서 무실패 <b>${streak}회 연속</b> → 보조를 <b>${recW}${u}</b>로 낮춰 난이도 업 추천!${recW===0?' 이제 맨몸 도전입니다 🔥':''}`
      : `탑세트 <b>${w}${u}</b> 무실패 <b>${streak}회 연속</b> 성공 → <b>${recW}${u}</b>로 증량 추천! 세트별 중량이 전체 ${recW-w>0?'+':''}${recW-w}${u} 됩니다.${barbell?` (${plateBreak(recW)||''})`:''}`;
  }else{
    recW=w;
    msg=`<b>${w}${u}</b> 무실패 ${streak}회째 (기준: 3회 연속) → <b>유지</b> 추천. ${3-streak}회만 더 깔끔하게!`;
  }
  const applyGoal = assist? recW<w : recW>w;
  const nextGoal = assist? Math.max(recW-inc,0) : fit(recW+inc);
  slot.innerHTML=`<div class="rec-box"><div class="msg">${msg}${applyGoal?` 적용 시 목표도 <b>${nextGoal}${u}</b>로 변경됩니다.`:''}</div><button data-apply="${i}" data-v="${recW}">적용</button></div>`;
  slot.querySelector('[data-apply]').onclick=ev=>{
    const v=parseFloat(ev.target.dataset.v);
    const diff=v-w;
    session.weights[i]=session.weights[i].map(x=>Math.max(0,+(x+diff).toFixed(2)));
    if(applyGoal){ plan[curPart].ex[i].goal=nextGoal; sSet('plan',plan); }
    queueSave(); slot.innerHTML='';
    toast(applyGoal?(assist?'난이도 업 + 목표 갱신 🔥':'전 세트 증량 + 목표 갱신 🔥'):'추천 중량 적용됨');
    renderExercises();
  };
}

// 한글 초성 추출 (초성 검색용)
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(str){
  return [...str].map(c=>{
    const code=c.charCodeAt(0);
    if(code>=0xAC00&&code<=0xD7A3) return CHO[Math.floor((code-0xAC00)/588)];
    return c;
  }).join('');
}
const norm = s => String(s||'').toLowerCase().replace(/\s+/g,'');
function exMatch(query, name){
  const q=norm(query);
  if(!q) return 3;
  const n=norm(name);
  const alias=norm(EXALIAS[name]||'');
  if(n.startsWith(q)) return 0;                       // 이름 시작 일치 (최우선)
  if(n.includes(q)) return 1;                         // 이름 부분 일치
  if(alias.includes(q)) return 1;                     // 별칭 일치 (벤프, ohp 등)
  if(chosung(n).includes(q)||chosung(name.replace(/\s+/g,'')).includes(q)) return 2; // 초성 (ㅅㅋㅌ)
  return -1;
}

function showSug(inp){
  const i=inp.dataset.i;
  const box=document.querySelector(`[data-sug="${i}"]`);
  const raw=inp.value;
  const starred=raw.startsWith('★');
  const q=cleanName(raw).toLowerCase();
  const customs=customNames();
  let items=[
    ...customs.map(n=>({n,cat:'내 운동',custom:true})),
    ...EXLIB.map(x=>({n:x[0],cat:x[1]}))
  ];
  if(q){
    items=items.map(x=>({...x,score:exMatch(q,x.n)}))
      .filter(x=>x.score>=0)
      .sort((a,b)=>(a.custom?-0.5:0)+a.score-((b.custom?-0.5:0)+b.score));
  }
  items=items.slice(0,8);
  if(!items.length || (items.length===1 && items[0].n===cleanName(raw))){ box.classList.add('hidden'); return; }
  box.innerHTML=items.map(x=>
    `<div data-pick="${esc(x.n)}">${esc(x.n)}${x.custom?'<span class="custom-mark">★ 내 기록</span>':`<span class="cat">${x.cat}</span>`}</div>`).join('');

/* ---- 칼로리 계산 ---- */
function getProfile(){ return sGet('profile'); }
function calcKcal(doneSets){
  const p=getProfile();
  if(!p||!p.w||!p.h||!p.age) return null;
  // Mifflin-St Jeor 기초대사량 (kcal/일)
  const bmr = 10*p.w + 6.25*p.h - 5*p.age + (p.sex==='m'?5:-161);
  // 실패지점 세트가 있으면 고강도(MET 6.0), 아니면 일반 웨이트(MET 5.0)
  const hasFail = session.sets.flat().includes(2);
  const met = hasFail?6.0:5.0;
  // 실측 시간(첫 세트~마지막 세트)이 타당하면 사용, 아니면 세트당 2.5분 추정
  let minutes = doneSets*2.5;
  if(session.t0&&session.t1){
    const span=(session.t1-session.t0)/60000 + 2; // 마지막 세트 수행분 보정
    if(span>=doneSets*1 && span<=doneSets*6+15) minutes=span;
  }
  return Math.round(met * (bmr/1440) * minutes);
}
function sessionMinutes(){
  if(session.t0&&session.t1){
    const m=Math.round((session.t1-session.t0)/60000+2);
    if(m>=1&&m<=300) return m;
  }
  return null;
}
function renderKcal(doneSets){
  const k=calcKcal(doneSets);
  $('kcalChip').innerHTML = k==null ? '🔥 <b>--</b> kcal' : `🔥 <b>${k}</b> kcal`;

/* ---- 주간 리포트 ---- */
function weekBounds(offsetWeeks){
  const now=new Date(); const mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7)-offsetWeeks*7);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return [f(mon),f(sun)];
}
function weekVolume(a,b){
  let vol=0;
  Object.values(exlog).forEach(logs=>logs.forEach(l=>{
    if(l.date>=a&&l.date<=b){
      const rep=l.rep||10;
      l.sets.forEach((s,j)=>{ if(s>0) vol += ((l.ws&&l.ws[j])||l.w||0)*rep; });
    }
  }));
  return Math.round(vol);
}
function renderWeekReport(){
  const [a,b]=weekBounds(0), [pa,pb]=weekBounds(1);
  const att=index.filter(r=>r.done&&r.date>=a&&r.date<=b).length;
  const attP=index.filter(r=>r.done&&r.date>=pa&&r.date<=pb).length;
  const vol=weekVolume(a,b), volP=weekVolume(pa,pb);
  const kc=index.filter(r=>r.date>=a&&r.date<=b).reduce((s,r)=>s+(r.kcal||0),0);
  const pct = volP>0? Math.round((vol-volP)/volP*100) : null;
  const arrow = v => v>0?`<b class="up">▲${v}%</b>`:(v<0?`<b class="dn">▼${Math.abs(v)}%</b>`:'<b>—</b>');
  $('wkCard').innerHTML=`<h3>이번 주 리포트 (${a.slice(5)} ~ ${b.slice(5)})</h3>
    출석 <b>${att}회</b>${attP?` (지난주 ${attP}회)`:''} · 소모 <b>${kc>0?kc+'kcal':'-'}</b><br>
    총 볼륨(중량×횟수) <b>${vol.toLocaleString()}kg</b> ${pct!=null?`· 지난주 대비 ${arrow(pct)}`:''}`;
}

function renderChartUI(){
  const names=Object.keys(exlog).filter(n=>(exlog[n]||[]).length>0).sort();
  const sel=$('chartSel');
  if(!names.length){ sel.innerHTML='<option>기록 없음</option>'; $('chartBox').innerHTML='<div class="chart-empty">세트를 기록하면 중량 변화 그래프가 여기에 그려져요 📈</div>'; return; }
  const prefer=['바벨 벤치 프레스','바벨 백 스쿼트','컨벤셔널 데드리프트'].find(n=>names.includes(n));
  const cur=sel.dataset.cur && names.includes(sel.dataset.cur) ? sel.dataset.cur : (prefer||names[0]);
  sel.innerHTML=names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
  sel.dataset.cur=cur;
  sel.onchange=()=>{ sel.dataset.cur=sel.value; drawChart(sel.value); };
  drawChart(cur);
}
function drawChart(name){
  const logs=(exlog[name]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  const box=$('chartBox');
  if(logs.length<2){ box.innerHTML='<div class="chart-empty">기록이 2회 이상 쌓이면 그래프가 그려져요. 지금 '+logs.length+'회 📈</div>'; return; }
  const W=340,H=150,P=28;
  const ws=logs.map(l=>l.w);
  const lo=Math.min(...ws), hi=Math.max(...ws);
  const span=(hi-lo)||1;
  const X=i=>P+ (W-2*P)*i/(logs.length-1);
  const Y=v=>H-P- (H-2*P)*(v-lo)/span;
  const pts=logs.map((l,i)=>`${X(i).toFixed(1)},${Y(l.w).toFixed(1)}`).join(' ');
  const dots=logs.map((l,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(l.w).toFixed(1)}" r="3.5" fill="#E8B54A"/>`).join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#31363E"/>
    <polyline points="${pts}" fill="none" stroke="#E8B54A" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}
    <text x="${P}" y="${Y(hi)-8}" fill="#8A8F98" font-size="10">${hi}</text>
    <text x="${P}" y="${H-P+14}" fill="#8A8F98" font-size="9">${logs[0].date.slice(5)}</text>
    <text x="${W-P}" y="${H-P+14}" fill="#8A8F98" font-size="9" text-anchor="end">${logs[logs.length-1].date.slice(5)}</text>
    <text x="${X(logs.length-1)}" y="${Y(ws[ws.length-1])-10}" fill="#F2F0EA" font-size="11" font-weight="bold" text-anchor="end">${ws[ws.length-1]}</text>
  </svg>`;
}

/* ---- rest timer (기존 유지) ---- */
let tLeft=0, tInt=null, audioCtx=null;
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.2,0.4].forEach(t=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value=880; g.gain.setValueAtTime(0.25,audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+t+0.15);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.16);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function startTimer(sec){
  tLeft=sec; clearInterval(tInt);
  $('timer').classList.add('show'); $('timer').classList.remove('flash');
  drawTimer();
  tInt=setInterval(()=>{
    tLeft--;
    if(tLeft<=0){ stopTimer(); beep(); toast('휴식 끝! 다음 세트 🔥'); return; }
    if(tLeft<=5) $('timer').classList.add('flash');
    drawTimer();
  },1000);
}
function drawTimer(){ $('tTime').textContent=Math.floor(tLeft/60)+':'+String(tLeft%60).padStart(2,'0'); }
function stopTimer(){ clearInterval(tInt); $('timer').classList.remove('show'); }
$('tSkip').onclick=stopTimer;
$('tPlus').onclick=()=>{ tLeft+=30; drawTimer(); };

/* ---- 운동 추천 (부족 부위 분석) ---- */
let sugCursor=0;
function findGaps(){
  const covered=new Set();
  plan[curPart].ex.forEach(e=>{
    (MTAG[cleanName(e.n)]||[]).forEach(t=>covered.add(t));
  });
  const gaps=[];
  (DESIRE[curPart]||[]).forEach(([tag,label,reps,hi])=>{
    if(covered.has(tag)) return;
    // 이 태그를 채울 수 있는 후보 (이미 구성에 없는 운동)
    const inPlan=new Set(plan[curPart].ex.map(e=>cleanName(e.n)));
    const cands=Object.keys(MTAG).filter(n=>MTAG[n].includes(tag)&&!inPlan.has(n));
    if(cands.length) gaps.push({tag,label,reps,cands});
  });
  return gaps;
}
function showExSug(){
  const slot=$('sugSlot');
  if(slot.innerHTML){ slot.innerHTML=''; return; }
  const gaps=findGaps();
  if(!gaps.length){
    slot.innerHTML=`<div class="sug-box">지금 <b>${plan[curPart].label}</b> 구성은 주요 자극이 골고루 채워져 있어요. 훌륭합니다 👍</div>`;
    return;
  }
  // (부족부위 × 후보운동) 평탄화 → 순환 커서
  const flat=[];
  gaps.forEach(g=>g.cands.forEach(c=>flat.push({tag:g.tag,label:g.label,reps:g.reps,pick:c})));
  const g=flat[sugCursor%flat.length];
  slot.innerHTML=`<div class="sug-box">
    지금 구성에 <b>${g.label}</b> 자극이 비어 있어요.<br>→ <b>${esc(g.pick)}</b> 추가 추천 (${g.reps} × 3세트)
    <div class="sug-acts">
      <button class="sug-add" id="sugAdd">＋ 구성에 추가</button>
      ${flat.length>1?'<button class="sug-next" id="sugNext">다른 추천</button>':''}
    </div>
  </div>`;
  $('sugAdd').onclick=()=>{
    plan[curPart].ex.push({n:g.pick, s:3, r:g.reps, w:0, u:ASSIST_EX.has(g.pick)?'보조kg':'kg', goal:'', tip:g.label+' 보강'});
    sSet('plan',plan);
    slot.innerHTML=''; sugCursor=0;
    renderExercises();
    toast(g.pick+' 추가됨 💪');
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  };
  const nx=$('sugNext');
  if(nx) nx.onclick=()=>{ sugCursor++; slot.innerHTML=''; showExSug(); };
}

/* ---- 프로필 모달 ---- */
let pSex='m';
function openProf(){
  const p=getProfile()||{};
  $('pHeight').value=p.h||''; $('pWeight').value=p.w||''; $('pAge').value=p.age||'';
  pSex=p.sex||'m'; drawSex();
  $('modalBg').classList.add('show'); $('profModal').classList.add('show');
}
function closeProf(){ $('modalBg').classList.remove('show'); $('profModal').classList.remove('show'); }
function drawSex(){
  $('pMale').classList.toggle('on',pSex==='m');
  $('pFemale').classList.toggle('on',pSex==='f');
}
$('pMale').onclick=()=>{pSex='m';drawSex();};
$('pFemale').onclick=()=>{pSex='f';drawSex();};
$('profBtn').onclick=openProf;
$('sugBtn').onclick=showExSug;
$('modalBg').onclick=()=>{ closeProf(); closeBk(); $('modalBg').classList.remove('show'); };
$('kcalChip').onclick=()=>{ if(!getProfile()) openProf(); };
$('pSave').onclick=()=>{
  const h=parseFloat($('pHeight').value), w=parseFloat($('pWeight').value), age=parseInt($('pAge').value);
  if(!h||!w||!age){ toast('키·몸무게·나이를 모두 입력해 주세요'); return; }
  sSet('profile',{h,w,age,sex:pSex});
  closeProf(); updateCount();
  toast('저장 완료! 이제 칼로리가 계산돼요 🔥');
};

/* ---- actions ---- */
function switchPart(p){
  curPart=p; sSet('lastPart',p);
  $('sugSlot').innerHTML=''; sugCursor=0;
  session=sGet('session:'+todayStr()+':'+p)||defaultSession(p);
  renderTabs(); renderExercises();
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveSession,600); }
function saveSession(){
  const date=todayStr();
  sSet('session:'+date+':'+curPart,session);
  session.prShown=session.prShown||{};
  // 운동별 기록(exlog) 갱신 — 추천/자동완성/그래프의 데이터 소스
  plan[curPart].ex.forEach((e,i)=>{
    const name=cleanName(e.n);
    if(!name) return;
    const st=session.sets[i]||[];
    if(!st.some(v=>v>0)) return;
    exlog[name]=exlog[name]||[];
    const j=exlog[name].findIndex(l=>l.date===date);
    const ws=session.weights[i].slice();
    const assist=isAssist(e.u);
    const topW = assist ? Math.min(...ws) : Math.max(...ws,0);
    // PR 감지: 완료된 세트 중 역대 최고(보조는 역대 최저) 갱신 시 축하
    const doneWs=ws.filter((_,k)=>st[k]>0);
    if(doneWs.length&&!session.prShown[name]){
      const prevLogs=exlog[name].filter(l=>l.date!==date);
      if(prevLogs.length){
        const prevBest = assist ? Math.min(...prevLogs.map(l=>l.w)) : Math.max(...prevLogs.map(l=>l.w));
        const nowBest = assist ? Math.min(...doneWs) : Math.max(...doneWs);
        if(assist ? nowBest<prevBest : nowBest>prevBest){
          session.prShown[name]=1;
          toast(`🎉 ${name} PR! ${nowBest}${e.u||'kg'} (이전 ${prevBest})`);
        }
      }
    }
    const rec={date, w:isFinite(topW)?topW:0, ws, sets:st.slice(), rep:parseInt(e.r)||10};
    if(j>=0) exlog[name][j]=rec; else exlog[name].push(rec);
    if(exlog[name].length>60) exlog[name]=exlog[name].slice(-60);
  });
  sSet('exlog',exlog);
  const sd=session.sets.flat().filter(v=>v>0).length, st=session.sets.flat().length;
  const i=index.findIndex(r=>r.date===date&&r.part===curPart);
  const rec={date,part:curPart,done:session.done,sd,st,kcal:calcKcal(sd),dur:sessionMinutes()};
  if(i>=0)index[i]=rec; else index.push(rec);
  sSet('index',index);
  renderLastLine();
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

$('doneBtn').onclick=()=>{
  session.done=!session.done; renderDoneBtn(); saveSession();
  toast(session.done?'출석 완료! 오늘도 성장 중 💪':'출석 취소됨');
};
$('editBtn').onclick=()=>{
  editMode=!editMode;
  $('editBtn').classList.toggle('on',editMode);
  $('editBtn').textContent=editMode?'✓ 완료':'✎ 편집';
  $('bar').classList.toggle('hidden',editMode);
  renderExercises();
};
$('vToday').onclick=()=>{ $('vToday').classList.add('on');$('vHist').classList.remove('on');$('todayView').classList.remove('hidden');$('histView').classList.add('hidden');if(!editMode)$('bar').classList.remove('hidden'); };
$('vHist').onclick=()=>{ $('vHist').classList.add('on');$('vToday').classList.remove('on');$('histView').classList.remove('hidden');$('todayView').classList.add('hidden');$('bar').classList.add('hidden'); renderHistory(); };

/* ---- init ---- */
const APP_VER='v4.0';
$('verTag').textContent=APP_VER;

// 서비스 워커 등록 (오프라인 지원)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
// 캐시 비우고 최신으로 다시 로드
async function forceUpdate(){
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.controller)
      navigator.serviceWorker.controller.postMessage('clear');
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
  }catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
}
$('refreshBtn').onclick=()=>{ toast('새 버전 확인 중...'); setTimeout(forceUpdate,400); };
$('updGo').onclick=forceUpdate;
// 백그라운드 새 버전 확인 → 배너
(async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER){
      $('updMsg').textContent=`새 버전 ${m[1]} 이(가) 나왔어요!`;
      $('updBanner').classList.add('show');
    }
  }catch(e){}
})();

// 마지막 운동일 안내
function renderLastLine(){
  const done=index.filter(r=>r.done).sort((a,b)=>b.date.localeCompare(a.date));
  const today=todayStr();
  const el=$('lastLine');
  if(done.some(r=>r.date===today)){ el.innerHTML='오늘 운동 완료 💪 잘하셨어요'; return; }
  if(!done.length){ el.innerHTML='첫 운동을 시작해 보세요 🔥'; return; }
  const last=done[0];
  const days=Math.round((new Date(today)-new Date(last.date))/86400000);
  const ago=days===0?'오늘':days===1?'어제':`${days}일 전`;
  el.innerHTML=`마지막 운동: <b>${ago}</b> · ${plan[last.part]?.label||last.part}${days>=4?' — 슬슬 가야죠? 👀':''}`;
}

(function(){
  const d=new Date();
  $('hdDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
  plan=sGet('plan')||JSON.parse(JSON.stringify(DEFAULT_PLAN));
  // 구버전 문자열 목표("62.5 → 65kg") → 숫자(65)로 변환
  Object.values(plan).forEach(p=>p.ex.forEach(e=>{
    if(typeof e.goal==='string' && e.goal.trim()!==''){
      const nums=e.goal.match(/\d+(\.\d+)?/g);
      e.goal=nums?parseFloat(nums[nums.length-1]):'';
    }
  }));
  sSet('plan',plan);
  index=sGet('index')||[];
  exlog=sGet('exlog')||{};
  curPart=sGet('lastPart')||'push';
  if(!plan[curPart])curPart='push';
  session=sGet('session:'+todayStr()+':'+curPart)||defaultSession(curPart);
  renderTabs(); renderExercises(); renderLastLine();
})();
